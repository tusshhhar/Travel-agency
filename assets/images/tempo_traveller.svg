  <path d="M 60 156 L 470 156" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" />
  
  <rect x="210" y="162" width="100" height="12" rx="2" fill="#f59e0b" />
  <text x="260" y="171" font-family="'Outfit', sans-serif" font-size="8" font-weight="bold" fill="#000" text-anchor="middle">CHARDHAM YATRA LUXURY</text>

