<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="100%" height="100%">
  <defs>
    <linearGradient id="goldL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="logoGlow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Icon Symbol -->
  <g transform="translate(10, 10)">
    <rect x="0" y="5" width="50" height="50" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="2" />
    <!-- Cab Front Silhouette -->
    <path d="M 12 40 L 17 26 C 19 22 23 20 30 20 L 35 20 C 42 20 46 22 48 26 L 53 40 Z" fill="url(#goldL)" />
    <circle cx="18" cy="40" r="3.5" fill="#0f172a" />
    <circle cx="47" cy="40" r="3.5" fill="#0f172a" />
    <!-- Windshield -->
    <path d="M 20 27 L 27 23 L 38 23 L 45 27 Z" fill="#0f172a" />
    <circle cx="32.5" cy="48" r="2" fill="#38bdf8" filter="url(#logoGlow)" />
  </g>
  
  <!-- Brand Text -->
  <text x="75" y="38" font-family="'Outfit', 'Inter', sans-serif" font-size="24" font-weight="900" letter-spacing="1.5" fill="#f8fafc">
    BISHNOI<tspan fill="#f59e0b"> TRAVELS</tspan>
  </text>
  <text x="76" y="54" font-family="'Inter', sans-serif" font-size="9" font-weight="600" letter-spacing="2" fill="#94a3b8">
    24×7 ALL INDIA CAB SERVICES • HARIDWAR
  </text>
</svg>
